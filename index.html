<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gara Main</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fons">

    <div class="glavnoe_okno">
        <h1>Gara Main</h1>
        
        <div id="kamni_schetchik" class="tekst_kamney">Akmeņi: 0 (x1.0)</div>

        <div class="blok_schetchika">
            <div id="moneti_schetchik" class="bolshie_moneti">0</div>
            <div class="tekst_monet">monētas</div>
            <div id="cps_cpc_ekran" class="dop_tekst">(CPS: 0 | CPC: 1)</div>
        </div>

        <button id="knopka_kamnja"></button>

        <div class="statistika_kamnja">
            <div id="uroven_klika_schetchik">Klikšķa līm: 1</div>
            <div id="kolichestvo_avto_schetchik">Auto fani: 0</div>
            <div id="shans_krita_schetchik" style="color: #ffbe0b;">Krita iespēja: 1%</div>
        </div>

        <div class="magazin">
            <div class="vesh_magazina">
                <button id="kupit_klik">Klikšķis +1</button>
            </div>
            <div class="vesh_magazina">
                <button id="kupit_avto">Auto +1/s</button>
            </div>
            <div class="vesh_magazina">
                <button id="kupit_krit">Krita iespēja +2%</button>
            </div>
        </div>

        <div class="rebirth_prokachka">
            <button id="knopka_rebirtha">Rebirth</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
